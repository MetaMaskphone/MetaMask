# ============================================================================
# eosafe.co —— 助记词加密备份接口（只放 POST）
#
# 后端：容器 srp-backup，容器内监听 8012，宿主机映射 8012
# 放行：POST /backup、POST /debug
# 拒绝：其它方法一律 405，其它路径一律 404
#
# 证书/日志路径按 1Panel 的站点目录结构写的，如果你的面板路径不同请改这三处：
#   ssl_certificate / ssl_certificate_key / access_log+error_log
# ============================================================================

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name eosafe.co;

    # ---------- 证书 ----------
    ssl_certificate     /www/sites/eosafe.co/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/eosafe.co/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # ---------- 日志 ----------
    access_log /www/sites/eosafe.co/log/access.log main;
    error_log  /www/sites/eosafe.co/log/error.log;

    # ---------- 强制 HTTPS ----------
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }
    error_page 497 https://$host$request_uri;

    # ---------- Cloudflare 真实 IP（不走 CF 就整段删掉）----------
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # ---------- 请求体限制（密文只有几百字节）----------
    client_max_body_size 1m;
    client_body_timeout 10s;

    # ---------- 唯一放行的两个端点，且必须是 POST ----------
    location = /backup {
        if ($request_method != POST) {
            return 405;
        }
        # 想再加一道 token 校验就取消下面两行注释（必须和 App 里的 token 一致）
        # if ($http_authorization != "Bearer dev-test-token") {
        #     return 401;
        # }

        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }

    location = /debug {
        if ($request_method != POST) {
            return 405;
        }

        proxy_pass http://127.0.0.1:8012;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    15s;
    }

    # ---------- 其它一切都不给 ----------
    location / {
        return 404;
    }
}
