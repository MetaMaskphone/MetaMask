# ============================================================================
# srp-backup 反向代理片段（贴进你现有的 server { ... } 里）
#
# 用法：把下面两个 location 原样放到
#         include /www/sites/ersofa.com/proxy/*.conf;
#       的**前面**，其它一行都不用改。
#
# 行为：
#   POST /backup → 转到容器 srp-backup（127.0.0.1:8012）
#   POST /debug  → 同上（App 的诊断上报）
#   其它方法访问这两个路径 → 405
#
# 注意：这里**故意没有**写 location / { return 404; }，
#       因为那样会把你站点主页打死。如果这个域名不做网站、只做接口，
#       再加一行 location / { return 404; } 即可。
# ============================================================================

location = /backup {
    if ($request_method != POST) {
        return 405;
    }

    # 想再加一道 token 校验就取消下面三行注释（要和 App 里的一致）
    # if ($http_authorization != "Bearer dev-test-token") {
    #     return 401;
    # }

    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8012;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;
    proxy_send_timeout    15s;
}

location = /debug {
    if ($request_method != POST) {
        return 405;
    }

    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8012;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;
    proxy_send_timeout    15s;
}
